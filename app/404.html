<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まいにち英単語</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages で「ページが見つからない」ときに表示される。
    // URL の後ろに余計な文字が付いていても、アプリの入口へ自動で戻す。
    (function () {
      var seg = (location.pathname.split('/')[1] || '').toLowerCase();
      var base = seg ? '/' + seg + '/' : '/';
      if (location.pathname !== base) location.replace(base);
    })();
  </script>
  <style>
    body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #FFF6EC; color: #2B2B3B; text-align: center; padding: 64px 16px; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px; background: #FF6B4A; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <p>ページが見つかりませんでした。アプリの入口へ移動します…</p>
  <a href="./">まいにち英単語を開く</a>
</body>
</html>
